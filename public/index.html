<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Task Manager</h1>
      <div class="language-control">
        <label for="language-select">Language</label>
        <select id="language-select">
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
        </select>
      </div>
      <div id="user-area"></div>
    </header>

    <main>
      <section id="auth-section" class="card hidden">
        <div class="tabs">
          <button id="show-login" class="active">Login</button>
          <button id="show-signup">Sign Up</button>
        </div>

        <form id="auth-form">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-input-wrap">
              <input id="password" name="password" type="password" required />
              <button id="toggle-password" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                <svg class="password-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path class="password-lashes" d="M7 7.4 5.8 5.2M12 6.5V4M17 7.4l1.2-2.2" />
                  <path class="password-eye" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                  <circle class="password-eye-dot" cx="12" cy="12" r="3" />
                  <path class="password-eye-slash" d="M4 20 20 4" />
                </svg>
              </button>
            </div>
          </div>
          <button type="submit">Submit</button>
          <p id="auth-message" class="message"></p>
        </form>
      </section>

      <section id="task-section" class="card hidden">
        <div id="weather-widget" class="weather-widget hidden"></div>
        
        <div class="task-header">
          <h2>Your Tasks</h2>
          <div class="export-buttons">
            <button id="send-summary-email" class="secondary">Send Email</button>
            <button id="export-excel" class="secondary">Export to Excel</button>
            <button id="export-pdf" class="secondary">Export to PDF</button>
            <button id="export-word" class="secondary">Export to Word</button>
          </div>
          <button id="logout-button" class="secondary">Logout</button>
        </div>

        <form id="task-form" class="task-form">
          <div class="field title-field">
            <label for="task-title">Title <span class="field-max">(max 20 characters)</span></label>
            <input id="task-title" type="text" required maxlength="20" size="20" />
            <p id="title-error" class="field-error hidden"></p>
          </div>
          <div class="field">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="task-description">Description <span class="field-max">(max 5000 characters)</span></label>
            <div class="rich-editor">
              <div class="rich-editor-toolbar" aria-label="Description formatting">
                <button type="button" data-editor="task-description" data-command="bold"><strong>B</strong></button>
                <button type="button" data-editor="task-description" data-command="italic"><em>I</em></button>
                <button type="button" data-editor="task-description" data-command="underline"><u>U</u></button>
                <button type="button" data-editor="task-description" data-command="insertUnorderedList">• List</button>
                <button type="button" data-editor="task-description" data-command="insertOrderedList">1. List</button>
              </div>
              <div id="task-description" class="rich-editor-surface" contenteditable="true" role="textbox" aria-multiline="true"></div>
            </div>
            <p id="description-error" class="field-error hidden"></p>
          </div>
          <div class="field">
            <label for="task-reminder">Date Time Alert</label>
            <input id="task-reminder" type="datetime-local" />
          </div>
          <div class="field">
            <label for="task-attachment">Upload File</label>
            <input id="task-attachment" type="file" />
            <p id="attachment-error" class="field-error hidden"></p>
          </div>
          <p id="form-error" class="field-error hidden"></p>
          <button type="submit">Add Task</button>
        </form>

        <div id="task-list" class="task-list"></div>
      </section>

      <section id="admin-section" class="card hidden">
        <div class="admin-header">
          <h2>Manage Users</h2>
          <p id="admin-message" class="message"></p>
        </div>

        <form id="admin-user-form" class="admin-user-form">
          <div class="field">
            <label for="admin-username">Username</label>
            <input id="admin-username" type="text" required />
          </div>
          <div class="field">
            <label for="admin-password">Password</label>
            <input id="admin-password" type="password" required />
          </div>
          <button type="submit">Add User</button>
        </form>

        <div class="user-table-wrap">
          <table class="user-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Tasks</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="user-list"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="delete-confirm-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-title">
    <div class="modal">
      <h3 id="delete-confirm-title">Delete task?</h3>
      <p id="delete-confirm-message">This task will be permanently removed.</p>
      <div class="modal-actions">
        <button id="confirm-delete-no" type="button" class="secondary">No</button>
        <button id="confirm-delete-yes" type="button" class="danger">Yes</button>
      </div>
    </div>
  </div>

  <div id="edit-task-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="edit-task-title">
    <div class="modal edit-task-modal">
      <h3 id="edit-task-title">Edit task</h3>
      <form id="edit-task-form">
        <div class="field title-field">
          <label for="edit-task-title-input">Title <span class="field-max">(max 20 characters)</span></label>
          <input id="edit-task-title-input" type="text" required maxlength="20" size="20" />
          <p id="edit-title-error" class="field-error hidden"></p>
        </div>
        <div class="field">
          <label for="edit-task-priority-input">Priority</label>
          <select id="edit-task-priority-input">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label for="edit-task-description-input">Description <span class="field-max">(max 5000 characters)</span></label>
          <div class="rich-editor">
            <div class="rich-editor-toolbar" aria-label="Description formatting">
              <button type="button" data-editor="edit-task-description-input" data-command="bold"><strong>B</strong></button>
              <button type="button" data-editor="edit-task-description-input" data-command="italic"><em>I</em></button>
              <button type="button" data-editor="edit-task-description-input" data-command="underline"><u>U</u></button>
              <button type="button" data-editor="edit-task-description-input" data-command="insertUnorderedList">• List</button>
              <button type="button" data-editor="edit-task-description-input" data-command="insertOrderedList">1. List</button>
            </div>
            <div id="edit-task-description-input" class="rich-editor-surface" contenteditable="true" role="textbox" aria-multiline="true"></div>
          </div>
          <p id="edit-description-error" class="field-error hidden"></p>
        </div>
        <div class="field">
          <label for="edit-task-reminder-input">Date Time Alert</label>
          <input id="edit-task-reminder-input" type="datetime-local" />
        </div>
        <div class="field">
          <label for="edit-task-attachment-input">Upload File</label>
          <a id="edit-current-attachment" class="task-attachment hidden"></a>
          <input id="edit-task-attachment-input" type="file" />
          <p id="edit-attachment-error" class="field-error hidden"></p>
        </div>
        <p id="edit-form-error" class="field-error hidden"></p>
        <div class="modal-actions">
          <button id="cancel-edit-task" type="button" class="secondary">Cancel</button>
          <button id="save-edit-task" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="preview-task-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="preview-task-title">
    <div class="modal preview-task-modal">
      <h3 id="preview-task-title">Preview</h3>
      <div id="preview-task-description" class="preview-task-description"></div>
      <div class="modal-actions">
        <button id="edit-preview-task" type="button">Edit</button>
        <button id="close-preview-task" type="button" class="secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="status-toast" class="status-toast hidden" role="status" aria-live="polite"></div>

  <div id="upload-progress-overlay" class="upload-progress-overlay hidden" role="alert" aria-live="assertive">
    <div class="upload-progress-panel">
      <h3 id="upload-progress-title">Uploading file</h3>
      <p id="upload-progress-text">Please wait until the upload finishes.</p>
      <div class="upload-progress-track" aria-hidden="true">
        <div id="upload-progress-fill" class="upload-progress-fill"></div>
      </div>
      <div id="upload-progress-percent" class="upload-progress-percent">0%</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@7.1.0/build/index.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
